<!-- @dsCard group="Colors" viewport="700x150" name="Interaction states" subtitle="Rest → hover → active, all from the blue ramp" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;background:#fff} .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--color-text-muted)} .n{font-size:12px;font-weight:600}</style>
</head><body>
<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px;font-weight:500">
<span style="padding:12px 16px;border:1px solid var(--color-border);border-radius:var(--radius-md)">Rest</span>
<span style="padding:12px 16px;border:1px solid var(--color-brand-tint-border);background:var(--color-brand-tint);color:var(--color-brand-strong);border-radius:var(--radius-md)">Hover</span>
<span style="padding:12px 16px;background:var(--color-brand-strong);color:#fff;border-radius:var(--radius-md)">Active</span>
<span style="padding:12px 16px;background:var(--color-brand-stronger);color:#fff;border-radius:var(--radius-md)">Active hover</span>
<span style="padding:12px 16px;border:1px solid var(--color-border);border-radius:var(--radius-md);outline:2px solid var(--color-accent);outline-offset:2px">Focus</span>
<span style="display:flex;align-items:center;gap:12px;padding:0 12px;min-height:48px;background:var(--color-brand-tint);border-radius:var(--radius-md);font-weight:400;font-size:16px;width:200px"><span style="font-size:24px">🇯🇵</span><span style="flex:1">Japan</span><span style="font-size:14px;color:var(--color-text-muted)">JP</span></span>
</div>
</body></html>
