<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="Soft, never pill-shaped except round icon buttons" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;background:#fff} .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--color-text-muted)} .n{font-size:12px;font-weight:600}</style>
</head><body>
<div style="display:flex;gap:28px;align-items:flex-end"><div style="display:grid;gap:6px;justify-items:center"><div style="width:64px;height:64px;background:var(--color-brand-tint);border:1.5px solid var(--blue-500);border-radius:var(--radius-sm)"></div><span class="n">sm · 6px</span><span class="m">handles</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:64px;height:64px;background:var(--color-brand-tint);border:1.5px solid var(--blue-500);border-radius:var(--radius-md)"></div><span class="n">md · 10px</span><span class="m">buttons, inputs</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:64px;height:64px;background:var(--color-brand-tint);border:1.5px solid var(--blue-500);border-radius:var(--radius-lg)"></div><span class="n">lg · 12px</span><span class="m">popover</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:64px;height:64px;background:var(--color-brand-tint);border:1.5px solid var(--blue-500);border-radius:var(--radius-xl)"></div><span class="n">xl · 16px</span><span class="m">sheet</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:64px;height:64px;background:var(--color-brand-tint);border:1.5px solid var(--blue-500);border-radius:var(--radius-full)"></div><span class="n">full · 999px</span><span class="m">icon buttons</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:64px;height:64px;background:var(--color-brand-tint);border:1.5px solid var(--blue-500);border-radius:var(--radius-icon)"></div><span class="n">icon · 21.875%</span><span class="m">app icon</span></div></div>
</body></html>
