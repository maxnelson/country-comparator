<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;background:#fff} .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--color-text-muted)} .n{font-size:12px;font-weight:600}</style>
</head><body>
<div style="display:flex;gap:20px;align-items:flex-end"><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-1);height:var(--space-1);background:var(--blue-400);border-radius:2px"></div><span class="n">space-1</span><span class="m">4px</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-2);height:var(--space-2);background:var(--blue-400);border-radius:2px"></div><span class="n">space-2</span><span class="m">8px</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-3);height:var(--space-3);background:var(--blue-400);border-radius:2px"></div><span class="n">space-3</span><span class="m">12px</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-4);height:var(--space-4);background:var(--blue-400);border-radius:2px"></div><span class="n">space-4</span><span class="m">16px</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-5);height:var(--space-5);background:var(--blue-400);border-radius:2px"></div><span class="n">space-5</span><span class="m">24px</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-6);height:var(--space-6);background:var(--blue-400);border-radius:2px"></div><span class="n">space-6</span><span class="m">32px</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-8);height:var(--space-8);background:var(--blue-400);border-radius:2px"></div><span class="n">space-8</span><span class="m">48px</span></div></div>
</body></html>
